task_id: query-expansion-v1
description: Distill Gemini 3.5 Flash into Gemma 3 4B for retail e-commerce product search query expansion across varying degrees of product detail (broad generic searches to hyper-specific brand, color, material, and attribute queries).

gcp:
  project_id: my-gcp-project
  location: us-central1
  bucket_name: my-distillfw-bucket
  tasks_prefix: tasks

prompt_construction:
  system_instructions: >-
    You are a retail e-commerce product search query expansion engine. Given a shopper product query
    (ranging from broad generic queries like "running shoes" to highly detailed product descriptions
    like "adidas pair of sporting shoes with red stripes"), generate a structured JSON object containing:
    rewritten_dense_query, keyword_synonyms (list), product_category, specificity_level (broad/medium/high),
    and extracted_attributes (object with brand, color, material, style, size, or features when present).
  prompt_template: |-
    Expand the following retail product search query for hybrid e-commerce catalog retrieval.
    Retail Category: {retail_category}
    Query Detail Level: {query_detail_level}
    Shopper Query: "{shopper_query}"

teacher:
  model_id: gemini-3.5-flash
  location: global
  temperature: 0.3
  top_p: 0.95
  max_output_tokens: 2048
  candidate_count: 1
  response_logprobs: false
  thinking_budget: null
  shard_size: 50

student:
  model_id: google/gemma-3-4b-it
  source: huggingface
  peft_method: lora
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  max_seq_length: 2048
  dtype: bfloat16

formatting:
  prompt_format: chat
  dataset_representation: text
  train_split_ratio: 0.80
  val_split_ratio: 0.10
  test_split_ratio: 0.10
  seed: 42

training:
  paradigm: off_policy
  algorithm: sft_seqkd
  execution_mode: vertex_custom_job
  num_epochs: 3
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  temperature: 1.0
  skew_alpha: 0.1
  vertex_machine_type: g2-standard-48
  vertex_accelerator_type: NVIDIA_L4
  vertex_accelerator_count: 4

evaluation:
  metrics:
    - rouge
    - bleu
    - exact_match
    - llm_judge
    - latency
  judge_model_id: gemini-3.5-flash
  judge_model_location: global
  max_eval_samples: 50
  vertex_machine_type: g2-standard-12
  vertex_accelerator_type: NVIDIA_L4
  vertex_accelerator_count: 1

deployment:
  merge_lora: true
  machine_type: g2-standard-12
  accelerator_type: NVIDIA_L4
  accelerator_count: 1
  min_replica_count: 1
  max_replica_count: 3
